version: "3.9"
services:
  aosp:
    build: .
    container_name: aosp-builder
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - USE_CCACHE=1
      - CCACHE_DIR=/ccache
      - CCACHE_MAXSIZE=50G
    volumes:
      - /mnt/storage/ss20:/mnt/storage/note10
      - /mnt/storage/note10/out:/mnt/storage/note10/out
      - /mnt/storage/note10/vendor:/mnt/storage/note10/vendor
      - /mnt/storage/note10/device/samsung:/mnt/storage/note10/device/samsung
      - /mnt/storage/note10/device/samsung_slsi:/mnt/storage/note10/device/samsung_slsi
      - /mnt/storage/note10/kernel:/mnt/storage/note10/kernel
      # 需要排除的目录 /mnt/storage/ss20/out /mnt/storage/ss20/device
    restart: unless-stopped